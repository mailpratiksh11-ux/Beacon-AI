<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColdMailer AI — Login (Animated People)</title>
<style>
  :root {
    --brand: #2563eb;
    --brand-700: #1d4ed8;
    --emerald: #10b981;
    --ink: #0b1220;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; background: #070b1a; overflow: hidden; }

  .stage { position: fixed; inset: 0; display: grid; place-items: center; }

  /* ---------- Animated people background ---------- */
  .people { position: absolute; inset: 0; display: flex; gap: 22px; justify-content: center; padding: 0 8px; transform: rotate(-6deg) scale(1.25); transform-origin: center; }
  .col { width: 210px; flex: none; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }
  @media (max-width: 900px) { .col:nth-child(4), .col:nth-child(5) { display: none; } }
  @media (max-width: 620px) { .col:nth-child(3) { display: none; } .people { gap: 16px; transform: rotate(-8deg) scale(1.5); } }
  .track { display: flex; flex-direction: column; gap: 18px; animation: up var(--dur, 40s) linear infinite; will-change: transform; }
  .col.rev .track { animation-name: down; }
  @keyframes up   { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  @keyframes down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } }

  .persona { background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.6); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 13px; box-shadow: 0 10px 30px -14px rgba(0,0,0,.5); }
  .persona .face { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; flex: none; line-height: 1; }
  .persona .who { min-width: 0; }
  .persona .who b { display: block; font-size: 13.5px; color: #0b1220; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .persona .role { font-size: 11.5px; font-weight: 600; margin-top: 2px; display: inline-block; padding: 1px 8px; border-radius: 999px; }

  /* profession color coding */
  .r-mkt  { background: #ede9fe; color: #6d28d9; } .f-mkt  { background: #f5f3ff; }
  .r-hr   { background: #dcfce7; color: #15803d; } .f-hr   { background: #f0fdf4; }
  .r-rec  { background: #dbeafe; color: #1d4ed8; } .f-rec  { background: #eff6ff; }
  .r-job  { background: #ffedd5; color: #c2410c; } .f-job  { background: #fff7ed; }
  .r-sales{ background: #cffafe; color: #0e7490; } .f-sales{ background: #ecfeff; }
  .r-found{ background: #fce7f3; color: #be185d; } .f-found{ background: #fdf2f8; }

  .scrim { position: absolute; inset: 0; background:
    radial-gradient(80% 70% at 50% 48%, rgba(7,11,26,.55), rgba(7,11,26,.9) 78%),
    linear-gradient(180deg, rgba(37,99,235,.25), rgba(7,11,26,.5)); }

  /* ---------- Login card ---------- */
  .card { position: relative; width: min(392px, 90vw); background: rgba(14,19,40,.62); backdrop-filter: blur(22px) saturate(1.25); -webkit-backdrop-filter: blur(22px) saturate(1.25); border: 1px solid rgba(255,255,255,.14); border-radius: 24px; padding: 34px 32px; box-shadow: 0 40px 90px -34px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08); color: #fff; animation: rise .6s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: #cdd7ec; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); padding: 5px 12px; border-radius: 999px; margin-bottom: 18px; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 9px var(--emerald); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo .m { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(140deg,#3b82f6,#1d4ed8); display: grid; place-items: center; }
  .logo .m svg { width: 18px; height: 18px; color: #fff; }
  .logo b { font-size: 16px; letter-spacing: -.01em; }
  .logo .ai { font-size: 10px; font-weight: 700; color: #93c5fd; background: rgba(59,130,246,.18); padding: 2px 6px; border-radius: 5px; }
  h1 { font-size: 25px; margin: 6px 0 6px; letter-spacing: -.02em; }
  .sub { font-size: 14px; color: #a9b4cc; margin: 0 0 24px; line-height: 1.5; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; color: #d7deee; }
  .rowlab { display: flex; justify-content: space-between; align-items: center; }
  .rowlab a { font-size: 12px; color: #93c5fd; text-decoration: none; font-weight: 600; }
  .inp { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 0 13px; height: 46px; transition: border-color .15s, box-shadow .15s, background .15s; }
  .inp:focus-within { border-color: #60a5fa; background: rgba(255,255,255,.09); box-shadow: 0 0 0 3px rgba(37,99,235,.25); }
  .inp svg { width: 16px; height: 16px; color: #93a1bd; flex: none; }
  .inp input { border: 0; outline: 0; background: transparent; width: 100%; font: inherit; font-size: 14px; color: #fff; }
  .inp input::placeholder { color: #7c88a3; }
  .btn { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .08s; }
  .btn:hover { background: var(--brand-700); } .btn:active { transform: scale(.99); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: #8b93a7; font-size: 12px; }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: rgba(255,255,255,.14); }
  .gbtn { width: 100%; height: 46px; border: 0; border-radius: 12px; background: rgba(255,255,255,.94); color: #0b1220; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; transition: background .15s; }
  .gbtn:hover { background: #fff; } .gbtn svg { width: 17px; height: 17px; }
  .foot { text-align: center; font-size: 13px; color: #a9b4cc; margin: 22px 0 0; }
  .foot a { color: #93c5fd; text-decoration: none; font-weight: 600; }
  .btn:focus-visible, .gbtn:focus-visible, a:focus-visible, .inp input:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
</style>
</head>
<body>
<div class="stage">
  <div class="people" id="people" aria-hidden="true"></div>
  <div class="scrim"></div>

  <div class="card">
    <div class="pill"><span class="dot"></span> Trusted by marketers, recruiters &amp; job seekers</div>
    <div class="logo">
      <span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg></span>
      <b>ColdMailer</b><span class="ai">AI</span>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to reach the right people.</p>

    <form onsubmit="return false">
      <div class="field">
        <label>Email address</label>
        <div class="inp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg><input type="email" placeholder="you@company.com"></div>
      </div>
      <div class="field">
        <div class="rowlab"><label>Password</label><a href="#">Forgot password?</a></div>
        <div class="inp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" placeholder="••••••••"></div>
      </div>
      <button class="btn">Log in <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="divider">or</div>
      <button class="gbtn"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38Z"/></svg> Continue with Google</button>
      <p class="foot">New to ColdMailer? <a href="#">Create an account</a></p>
    </form>
  </div>
</div>

<script>
  // People who use ColdMailer — profession personas (self-contained emoji, no external images)
  var PEOPLE = [
    ['👩🏽‍💼','Priya Menon','Marketing Lead','mkt'],
    ['🧑🏾‍💼','Amara Okoye','HR Manager','hr'],
    ['👨🏽‍💼','Raj Malhotra','Recruiter','rec'],
    ['👩🏻‍🎓','Mia Chen','Job Seeker','job'],
    ['👨🏼‍💼','Leo Alvarez','Account Exec','sales'],
    ['🧑🏻‍💼','Kai Nowak','Founder','found'],
    ['👨🏻‍💻','Noah Park','New Grad · Job Seeker','job'],
    ['👩🏾‍💼','Zara Hussain','Growth Marketer','mkt'],
    ['🧑🏼‍💼','Sam Rivera','Talent Acquisition','rec'],
    ['👩🏼‍💼','Elena Costa','People Ops','hr'],
    ['👨🏾‍🎓','Marcus Dube','Job Seeker','job'],
    ['👩🏽‍💻','Nina Kapoor','Startup Founder','found'],
    ['🧑🏻‍💻','Dev Sharma','SDR · Sales','sales'],
    ['👩🏿‍💼','Aisha Bello','Brand Manager','mkt'],
    ['👨🏻‍💼','Tom Becker','Head of Talent','rec'],
    ['🧑🏽‍🎓','Ana Duarte','Job Seeker','job'],
    ['👩🏻‍💼','Grace Lin','HR Business Partner','hr'],
    ['👨🏽‍💻','Omar Haddad','Founder','found'],
  ];
  var LABEL = { mkt:'Marketing', hr:'HR', rec:'Recruiter', job:'Job Seeker', sales:'Sales', found:'Founder' };
  var TINT  = { mkt:'#f5f3ff', hr:'#f0fdf4', rec:'#eff6ff', job:'#fff7ed', sales:'#ecfeff', found:'#fdf2f8' };

  function cardHTML(p) {
    return '<div class="persona">' +
      '<span class="face" style="background:' + TINT[p[3]] + '">' + p[0] + '</span>' +
      '<span class="who"><b>' + p[1] + '</b>' +
      '<span class="role r-' + p[3] + '">' + LABEL[p[3]] + '</span></span></div>';
  }

  var stage = document.getElementById('people');
  var cols = 5, durations = [46, 38, 52, 42, 48], reverse = [false, true, false, true, false];
  // shuffle a copy so each column differs
  function shuffled() { var a = PEOPLE.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  for (var c = 0; c < cols; c++) {
    var col = document.createElement('div');
    col.className = 'col' + (reverse[c] ? ' rev' : '');
    var track = document.createElement('div');
    track.className = 'track';
    track.style.setProperty('--dur', durations[c] + 's');
    var list = shuffled();
    var html = list.map(cardHTML).join('');
    track.innerHTML = html + html; // duplicate for seamless loop
    col.appendChild(track);
    stage.appendChild(col);
  }
</script>
</body>
</html>
