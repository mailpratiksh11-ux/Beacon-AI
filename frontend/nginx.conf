server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANT: nginx's add_header does NOT merge across levels — a location
    # that declares even one add_header DROPS every add_header inherited from
    # the server block. So the security headers below are repeated verbatim in
    # each location that sets Cache-Control. Omitting them there means the
    # landing page and index.html ship with no HSTS and no nosniff, which is
    # exactly the entry point where they matter most.

    # The root is the marketing page, not the app. Exact-match location, so it
    # wins over the prefix match below. landing.html ships via Angular's public/
    # assets, so it is already in the build output.
    #
    # Its "Get Started" button points at /login, which falls through to the SPA
    # below — one origin, so that link is a plain navigation with nothing to
    # configure.
    location = / {
        try_files /landing.html =404;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Legal pages. Google's OAuth review fetches these URLs directly and rejects
    # the submission if either 404s, so they are exact-match locations: the SPA
    # fallback below would otherwise rewrite /privacy to index.html and Angular
    # would answer with its own 404 — a 200 response that a reviewer still reads
    # as a missing policy.
    #
    # no-cache, not no-store: these change rarely but must never be served stale
    # after a policy update.
    location = /privacy {
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /terms {
        try_files /terms.html =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else is the SPA. This must be a REWRITE, not a redirect: the
    # Google OAuth bounce-back arrives as /auth/callback?token=... and a
    # redirect would drop the query string before Angular could read it.
    #
    # No add_header here, so this one inherits the server-level set.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are content-addressed, so they can be cached forever.
    # The regex MUST be quoted: nginx reads an unquoted { } as a block delimiter,
    # so the {8} repeat count aborts startup with "unknown directive".
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must never be cached, or users keep a stale shell pointing at
    # chunk files that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Traefik terminates TLS and forwards plain HTTP here, so this header is
    # what the browser ultimately receives over HTTPS. One year, and
    # includeSubDomains covers *.beacon.heypratikk.com only — api.heypratikk.com
    # is a sibling, not a subdomain, so it is unaffected and keeps its own cert.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
