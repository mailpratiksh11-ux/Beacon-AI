server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. This must be a REWRITE, not a redirect: the Google OAuth
    # bounce-back arrives as /auth/callback?token=... and a redirect would drop
    # the query string before Angular could read it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are content-addressed, so they can be cached forever.
    location ~* -[A-Z0-9]{8}\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep a stale shell pointing at
    # chunk files that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
